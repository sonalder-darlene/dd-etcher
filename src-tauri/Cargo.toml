[package]
name = "dd-etcher"
version = "0.2.0"
description = "A minimal, native image flasher using dd"
authors = ["dd-Etcher contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/sonalder-darlene/dd-etcher"
edition = "2021"
rust-version = "1.85"

[lib]
name = "dd_etcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.7"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
libc = "0.2"
zeroize = "1"
# Vendored liblzma (0BSD). Raspberry Pi OS and friends ship .img.xz.
xz2 = { version = "0.1", features = ["static"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
